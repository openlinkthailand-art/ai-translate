<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ทบทวนคำศัพท์ — อ่านไทย</title>
  <link rel="stylesheet" href="../ui/pages.css" />
  <style>
    .wrap { max-width: 720px; }
    .screen { }
    .flash {
      background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
      padding: 26px 24px; box-shadow: var(--shadow); min-height: 330px;
      display: flex; flex-direction: column;
    }
    .fw { font-size: 34px; font-weight: 800; line-height: 1.25; text-align: center; word-break: break-word; }
    .fmeta { text-align: center; color: var(--fg-muted); font-size: 13px; margin-top: 6px; }
    .fctx { text-align: center; color: var(--fg-muted); font-size: 14px; margin-top: 16px; font-style: italic; }
    .answer { margin-top: 18px; border-top: 1px dashed var(--border); padding-top: 16px; }
    .answer .tr { font-size: 25px; font-weight: 700; color: var(--accent); text-align: center; }
    .sec { margin-top: 14px; }
    .lbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--fg-muted); margin-bottom: 5px; }
    .ex { background: var(--panel-2); border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px; margin-bottom: 6px; font-size: 13.5px; }
    .ex .th { color: var(--fg-muted); }
    .hook { background: var(--accent-soft); border-radius: 9px; padding: 9px 11px; font-size: 13.5px; }
    .grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 18px; }
    .grade { padding: 11px 6px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); cursor: pointer; font-family: inherit; color: var(--fg); text-align: center; }
    .grade:hover { border-color: var(--accent); }
    .grade .g-t { font-weight: 700; font-size: 14px; }
    .grade .g-i { font-size: 11.5px; color: var(--fg-muted); }
    .grade[data-g="0"]:hover { border-color: var(--danger); color: var(--danger); }
    .grade[data-g="3"]:hover { border-color: var(--ok); color: var(--ok); }
    .progress { height: 6px; background: var(--panel-2); border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
    .progress > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
    .center-big { text-align: center; padding: 26px 10px; }
    .center-big .big { font-size: 46px; }
    kbd { background: var(--panel-2); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; font-size: 12px; font-family: inherit; }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- หน้าเริ่ม -->
    <section id="screen-start" class="screen">
      <h1>🎯 ทบทวนคำศัพท์</h1>
      <p class="muted small">ระบบจะจัดคิวให้ตามความจำของคุณ (spaced repetition) — คำที่ตอบผิดจะกลับมาเร็วขึ้น คำที่ตอบถูกจะห่างออกไปเรื่อย ๆ</p>
      <div class="stats" style="margin:16px 0">
        <div class="stat"><div class="n" id="st-due">0</div><div class="l">ถึงกำหนดวันนี้</div></div>
        <div class="stat"><div class="n" id="st-total">0</div><div class="l">คำทั้งหมด</div></div>
        <div class="stat"><div class="n" id="st-mature">0</div><div class="l">จำได้ระยะยาว</div></div>
        <div class="stat"><div class="n" id="st-star">0</div><div class="l">ปักดาวไว้</div></div>
      </div>
      <div class="card">
        <div class="row wrap-row">
          <button class="btn primary" id="btn-due">เริ่มทบทวนคำที่ถึงกำหนด</button>
          <button class="btn" id="btn-all">ทบทวนทุกคำ</button>
          <button class="btn" id="btn-star">ทบทวนคำที่ปักดาว</button>
        </div>
        <p class="small muted" style="margin:12px 0 0">
          คีย์ลัด: <kbd>Space</kbd> เฉลย · <kbd>1</kbd>-<kbd>4</kbd> ให้คะแนน · <kbd>S</kbd> ข้ามคำนี้
        </p>
      </div>
      <div id="empty-hint"></div>
    </section>

    <!-- หน้าทบทวน -->
    <section id="screen-session" class="screen hidden">
      <div class="row" style="margin-bottom:10px">
        <span class="chip" id="counter">0 / 0</span>
        <div class="spacer"></div>
        <button class="btn sm ghost" id="btn-quit">จบรอบนี้</button>
      </div>
      <div class="progress"><i id="bar"></i></div>
      <div class="flash">
        <div class="fw" id="f-word">—</div>
        <div class="fmeta" id="f-meta"></div>
        <div class="fctx" id="f-ctx"></div>
        <div class="spacer" style="flex:1"></div>
        <div id="reveal-box" class="center">
          <button class="btn primary" id="btn-reveal" style="padding:11px 26px">เฉลย (Space)</button>
        </div>
        <div id="answer" class="answer hidden"></div>
      </div>
      <div class="grades hidden" id="grades">
        <button class="grade" data-g="0"><div class="g-t">อีกครั้ง</div><div class="g-i" id="i0">—</div></button>
        <button class="grade" data-g="1"><div class="g-t">ยาก</div><div class="g-i" id="i1">—</div></button>
        <button class="grade" data-g="2"><div class="g-t">ดี</div><div class="g-i" id="i2">—</div></button>
        <button class="grade" data-g="3"><div class="g-t">ง่าย</div><div class="g-i" id="i3">—</div></button>
      </div>
    </section>

    <!-- หน้าสรุป -->
    <section id="screen-done" class="screen hidden">
      <div class="card center-big">
        <div class="big">🎉</div>
        <h2>จบรอบทบทวนแล้ว</h2>
        <p id="done-summary" class="muted"></p>
        <div class="row" style="justify-content:center">
          <button class="btn primary" id="btn-again">ทบทวนอีกรอบ</button>
          <button class="btn" id="btn-library">เปิดคลังคำศัพท์</button>
        </div>
      </div>
    </section>
  </div>
  <script src="../config.js"></script>
  <script type="module" src="review.js"></script>
</body>
</html>
