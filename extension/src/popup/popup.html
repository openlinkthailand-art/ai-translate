<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>อ่านไทย</title>
  <link rel="stylesheet" href="../ui/pages.css" />
  <style>
    body { width: 390px; }
    .pop { padding: 12px 13px 10px; }
    .pop-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .logo { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 15px; }
    .pop-head .t { font-weight: 700; font-size: 15px; line-height: 1.15; }
    .pop-head .v { font-size: 11px; color: var(--fg-muted); }
    .qbox { display: flex; gap: 6px; margin: 10px 0; }
    .qbox textarea { min-height: 46px; max-height: 110px; font-size: 13.5px; }
    .result { border: 1px solid var(--border); border-radius: 11px; padding: 11px 12px; background: var(--panel); margin-bottom: 10px; }
    .result .tr { font-size: 17px; font-weight: 700; color: var(--accent); line-height: 1.45; }
    .result .sec { margin-top: 9px; }
    .result .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--fg-muted); margin-bottom: 4px; }
    .result .ex { font-size: 12.5px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; margin-bottom: 5px; }
    .result .ex .th { color: var(--fg-muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .stat { padding: 8px 10px; }
    .stat .n { font-size: 18px; }
    .recent { margin-top: 4px; }
    .recent .word { padding: 8px 10px; margin-bottom: 6px; }
    .foot { display: flex; gap: 6px; border-top: 1px solid var(--border); padding: 10px 13px; background: var(--panel); }
    .foot .btn { flex: 1; justify-content: center; }
    .sw-title { font-size: 13px; }
    .sw-hint { font-size: 11.5px; }
    .switch { padding: 7px 0; }
  </style>
</head>
<body>
  <div class="pop">
    <div class="pop-head">
      <div class="logo">อ</div>
      <div>
        <div class="t">อ่านไทย Translate Reader</div>
        <div class="v" id="version">v1.0.0</div>
      </div>
      <div class="spacer"></div>
      <button class="btn sm" id="btn-options" title="ตั้งค่า">⚙</button>
    </div>

    <div class="stats">
      <div class="stat"><div class="n" id="s-total">0</div><div class="l">คำในคลัง</div></div>
      <div class="stat"><div class="n" id="s-due">0</div><div class="l">ถึงกำหนดทบทวน</div></div>
      <div class="stat"><div class="n" id="s-today">0</div><div class="l">เพิ่มวันนี้</div></div>
    </div>

    <div class="qbox">
      <textarea id="q" placeholder="พิมพ์หรือวางคำ/ประโยคที่ต้องการแปล…"></textarea>
      <button class="btn primary" id="q-go" title="แปล">แปล</button>
    </div>
    <div id="q-result"></div>

    <div class="card" style="padding: 6px 12px; margin-bottom: 12px;">
      <div class="switch">
        <input type="checkbox" id="tg-enabled" />
        <div class="sw-body">
          <div class="sw-title">เปิดใช้งานบนหน้าเว็บ</div>
          <div class="sw-hint">ดับเบิลคลิกหรือคลุมข้อความเพื่อแปล</div>
        </div>
      </div>
      <div class="switch">
        <input type="checkbox" id="tg-site" />
        <div class="sw-body">
          <div class="sw-title">เปิดบนเว็บไซต์นี้</div>
          <div class="sw-hint" id="site-host">—</div>
        </div>
      </div>
      <div class="switch">
        <input type="checkbox" id="tg-pdf" />
        <div class="sw-body">
          <div class="sw-title">เปิด PDF ในโหมดอ่านแปลอัตโนมัติ</div>
          <div class="sw-hint">ใช้ตัวอ่าน PDF ที่ฝังมากับส่วนขยาย</div>
        </div>
      </div>
      <div class="switch">
        <input type="checkbox" id="tg-ai" />
        <div class="sw-body">
          <div class="sw-title">AI ช่วยอธิบายเชิงบริบท</div>
          <div class="sw-hint" id="ai-hint">ต้องตั้งค่า AI ในหน้าตั้งค่าก่อน</div>
        </div>
      </div>
    </div>

    <div class="row" style="margin-bottom: 6px;">
      <strong class="small">คำล่าสุด</strong>
      <div class="spacer"></div>
      <button class="btn sm ghost" id="btn-all">ดูทั้งหมด</button>
    </div>
    <div class="recent" id="recent"></div>
  </div>

  <div class="foot">
    <button class="btn" id="btn-library">📚 คลังคำศัพท์</button>
    <button class="btn primary" id="btn-review">🎯 ทบทวน <span id="due-badge"></span></button>
  </div>

  <script src="../config.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
